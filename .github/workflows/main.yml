name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build iOS App (.app & .ipa)
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          echo "Found project: $PROJ_PATH"
          
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: No .xcodeproj found in repository!"
            exit 1
          fi
          
          SCHEME=$(xcodebuild -project "$PROJ_PATH" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          echo "Found scheme: $SCHEME"
          
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build

          cd build/Release-iphoneos
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r AnnoPersonale.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnnoPersonale-iOS-IPA
          path: build/Release-iphoneos/AnnoPersonale.ipa
